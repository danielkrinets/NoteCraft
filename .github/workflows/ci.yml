name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: build & test (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev zlib1g-dev
      - name: Build
        run: make CC=${{ matrix.cc }} notecraft notecraft-demo
      - name: Unit tests
        run: make CC=${{ matrix.cc }} test
      - name: Headless render smoke test
        run: |
          ./notecraft-demo shot /tmp/book.png book 3
          ./notecraft-demo shot /tmp/files.png files 3
          test -s /tmp/book.png && test -s /tmp/files.png
      - name: Window smoke test (software renderer under xvfb)
        run: |
          sudo apt-get install -y xvfb
          printf 'Hello from CI\n' > /tmp/hello.txt
          SDL_RENDER_DRIVER=software xvfb-run -a ./notecraft --selftest-shot /tmp/window.png /tmp/hello.txt
          test -s /tmp/window.png
      - uses: actions/upload-artifact@v4
        if: matrix.cc == 'gcc'
        with:
          name: notecraft-linux-x86_64
          path: |
            notecraft
            /tmp/window.png

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - run: make CC=clang CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" notecraft-test
      - run: ./notecraft-test
